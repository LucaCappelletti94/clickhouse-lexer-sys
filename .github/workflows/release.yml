name: Release

# Pushing a `v*` tag publishes that version to crates.io and creates the GitHub
# release. crates.io authenticates the job through trusted publishing (OIDC), so
# no token is stored in the repository; see README.md for the one-time setup.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Tag matches Cargo.toml and is on main
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag v$tag is not on main" >&2
            exit 1
          fi
          # Re-running for an already published version only (re)creates the release.
          if curl -sSf "https://crates.io/api/v1/crates/clickhouse-lexer-sys/$version" >/dev/null; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - if: needs.verify.outputs.publish == 'yes'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - if: needs.verify.outputs.publish == 'yes'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create the GitHub release if missing
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            upstream=$(cat upstream/VERSION)
            commit=$(cat upstream/COMMIT)
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes \
              "Lexer sources from [ClickHouse/clickhouse-lexer $upstream](https://github.com/ClickHouse/clickhouse-lexer/releases/tag/$upstream), which mirrors [ClickHouse/ClickHouse@$commit](https://github.com/ClickHouse/ClickHouse/commit/$commit)."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
